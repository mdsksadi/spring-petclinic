
name: PetClinic CI CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          ./mvnw
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=PetClinic
          -Dsonar.projectName=PetClinic
          -Dsonar.host.url="http://localhost:9000"
          -Dsonar.token="$SONAR_TOKEN"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target/spring-petclinic-*.jar
          if-no-files-found: error

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target

      - name: Deploy to PetClinic EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            target/spring-petclinic-*.jar \
            ubuntu@"$EC2_HOST":/home/ubuntu/spring-petclinic.jar

          ssh -o StrictHostKeyChecking=accept-new ubuntu@"$EC2_HOST" \
            'sudo fuser -k 8080/tcp || true; nohup java -jar /home/ubuntu/spring-petclinic.jar --server.port=8080 > /home/ubuntu/petclinic.log 2>&1 < /dev/null &'
